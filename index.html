<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone Circle</title>
<style>
  :root {
    --bg: #0c0a07;
    --panel: #161310;
    --panel-edge: #4a4438;
    --ink: #eee7d8;
    --muted: #8c8672;
    --accent: #efe3c0;
    --accent-soft: #a89968;
    --wedge: #17140f;
    --wedge-hover: #241f17;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 48px;
    position: relative;
  }
  /* Film-grain texture, self-contained (no image asset): a fixed, static
     noise layer over everything. Held still (no flicker) so it reads as a
     textured surface rather than a flash; turned up further than a first
     pass for a more visibly textured background. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0.19;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMiIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjxmZUNvbG9yTWF0cml4IHR5cGU9InNhdHVyYXRlIiB2YWx1ZXM9IjAiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsdGVyPSJ1cmwoI24pIi8+PC9zdmc+");
    background-repeat: repeat;
    background-size: 200px 200px;
  }
  /* CRT scanlines, drifting slowly upward like a TV with the vertical hold
     off, instead of anything that flashes or flickers. */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 998;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(238, 231, 216, 0.06) 0px,
      rgba(238, 231, 216, 0.06) 1px,
      transparent 1px,
      transparent 4px
    );
  }
  @media (prefers-reduced-motion: no-preference) {
    body::after { animation: scanline-drift 9s linear infinite; }
    @keyframes scanline-drift {
      from { background-position: 0 0; }
      to   { background-position: 0 -4px; }
    }
  }
  header { text-align: center; margin-bottom: 16px; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 1.7rem;
    letter-spacing: 0.06em;
  }
  header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 6px;
    letter-spacing: 0.03em;
  }
  header p.credit {
    font-size: 0.72rem;
    margin-top: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-soft);
  }

  .keys {
    width: min(92vw, 560px);
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 14px 16px 16px;
    margin-bottom: 20px;
  }
  .keys h2 {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 10px;
  }
  .key-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
    gap: 8px;
  }
  .key-btn {
    background: var(--wedge);
    color: var(--ink);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 8px 0 5px;
    font-family: Georgia, serif;
    font-size: 1.05rem;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.25s ease;
    line-height: 1.1;
  }
  .key-btn small {
    display: block;
    font-family: system-ui, sans-serif;
    font-size: 0.58rem;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.02em;
  }
  .key-btn:hover { background: var(--wedge-hover); }
  .key-btn.active {
    background: var(--accent);
    color: #1a1510;
    border-color: var(--accent);
    box-shadow: 0 0 14px rgba(239, 227, 192, 0.45);
  }
  .key-btn.active small { color: #4a4030; }
  .key-btn small .pair { transition: opacity 0.15s ease; }
  .key-btn.active small .pair { opacity: 0.6; }
  .key-btn.active small .pair.current {
    opacity: 1;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .key-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .ring-wrap { width: min(92vw, 900px); }
  svg { width: 100%; height: auto; display: block; }

  .wedge path {
    fill: var(--wedge);
    stroke: var(--bg);
    stroke-width: 2.5;
    cursor: pointer;
    transition: fill 0.2s ease, filter 0.3s ease;
  }
  .wedge:hover path { fill: var(--wedge-hover); }
  .wedge text {
    fill: var(--muted);
    font-size: 20px;
    font-family: Georgia, serif;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    transition: fill 0.15s ease;
  }
  .wedge.active path {
    fill: var(--accent);
    stroke: var(--accent);
    filter: drop-shadow(0 0 8px rgba(239, 227, 192, 0.55));
  }
  .wedge.active text { fill: #1a1510; }
  .wedge:focus { outline: none; }
  .wedge:focus-visible path { stroke: var(--ink); stroke-width: 3; }

  @media (prefers-reduced-motion: no-preference) {
    .wedge.active path { animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(239, 227, 192, 0.4)); }
      50%      { filter: drop-shadow(0 0 12px rgba(239, 227, 192, 0.75)); }
    }
  }

  #hub circle {
    fill: var(--panel);
    stroke: var(--panel-edge);
    stroke-width: 1.5;
    cursor: pointer;
    transition: fill 0.15s ease;
  }
  #hub:hover circle { fill: #201c16; }
  #hub text {
    text-anchor: middle;
    pointer-events: none;
    font-family: system-ui, sans-serif;
  }
  #hub:focus { outline: none; }
  #hub:focus-visible circle { stroke: var(--ink); stroke-width: 2.5; }
  #hub-status { fill: var(--accent); font-size: 15px; }
  #hub-label { fill: var(--muted); font-size: 11px; letter-spacing: 0.12em; }

  /* Outer ring: decorative bass-clef circle-of-fifths reference */
  #ring-layer { pointer-events: none; }
  .ring-label {
    fill: var(--ink);
    font-size: 15px;
    font-family: Georgia, serif;
  }
  .ring-stamp line {
    stroke: var(--muted);
    stroke-width: 1;
    opacity: 0.55;
  }
  .ring-stamp path { fill: var(--accent); }

  .controls {
    margin-top: 22px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 18px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px 24px;
    width: min(92vw, 560px);
  }
  .control label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  select, input[type="number"] {
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 7px 9px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  select:focus-visible, input:focus-visible, input[type="range"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    margin-top: 8px;
  }
  .hint {
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.78rem;
    max-width: min(92vw, 560px);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <h1>Drone Circle</h1>
  <p>Pick a key for its primary drones, or tap tones on the circle of fifths.</p>
  <p class="credit">Primary drone chart by Scott Dixon</p>
</header>

<div class="keys">
  <h2>Key presets &middot; primary drones</h2>
  <div class="key-grid" id="key-grid" role="group" aria-label="Key presets"></div>
</div>

<div class="ring-wrap">
  <svg id="ring" viewBox="-150 -150 700 700" role="group" aria-label="Circle of fifths drone selector"></svg>
</div>

<div class="controls">
  <div class="control">
    <label for="octave">Octave</label>
    <select id="octave">
      <option value="1">1 (very low)</option>
      <option value="2">2 (bass)</option>
      <option value="3" selected>3 (cello range)</option>
      <option value="4">4 (middle)</option>
      <option value="5">5 (high)</option>
    </select>
  </div>
  <div class="control">
    <label for="wave">Timbre</label>
    <select id="wave">
      <option value="warm" selected>Warm (filtered saw)</option>
      <option value="reed">Reed (filtered square)</option>
      <option value="pure">Pure (sine)</option>
      <option value="glass">Glass (triangle)</option>
      <option value="organ">Organ (drawbar)</option>
      <option value="bow">Bowed string</option>
      <option value="choir">Choir (vowel formants)</option>
      <option value="bell">Bell (FM)</option>
    </select>
  </div>
  <div class="control">
    <label for="tuning">A4 reference (Hz)</label>
    <input type="number" id="tuning" min="400" max="466" step="0.5" value="440">
  </div>
  <div class="control">
    <label for="temperament">Temperament</label>
    <select id="temperament">
      <option value="equal" selected>Equal</option>
      <option value="just">Just (key centre D)</option>
    </select>
  </div>
  <div class="control">
    <label for="vol">Volume</label>
    <input type="range" id="vol" min="0" max="100" value="60" aria-label="Master volume">
  </div>
</div>

<script>
(function () {
  // ---- Circle of fifths, clockwise from the top ----
  const NOTES = [
    { label: "C",      pc: 0  },
    { label: "G",      pc: 7  },
    { label: "D",      pc: 2  },
    { label: "A",      pc: 9  },
    { label: "E",      pc: 4  },
    { label: "B",      pc: 11 },
    { label: "F\u266f/G\u266d", pc: 6  },
    { label: "D\u266d", pc: 1  },
    { label: "A\u266d", pc: 8  },
    { label: "E\u266d", pc: 3  },
    { label: "B\u266d", pc: 10 },
    { label: "F",      pc: 5  }
  ];

  // ---- Drone pairs (root pc; the fifth is root + 7 semitones) ----
  const PAIRS = {
    "G/D":   7,
    "D/A":   2,
    "B/F#":  11,
    "F#/C#": 6,
    "Bb/F":  10,
    "Eb/Bb": 3
  };

  // ---- Primary Drone(s) column, row by row from the chart ----
  const KEYS = [
    { key: "C",  pairs: ["G/D", "D/A"] },
    { key: "G",  pairs: ["D/A"] },
    { key: "D",  pairs: ["D/A"] },
    { key: "A",  pairs: ["B/F#"] },
    { key: "E",  pairs: ["B/F#", "F#/C#"] },
    { key: "B",  pairs: ["B/F#", "F#/C#"] },
    { key: "F\u266f", pairs: ["B/F#", "F#/C#"] },
    { key: "C\u266f", pairs: ["F#/C#"] },
    { key: "F",  pairs: ["G/D", "D/A"] },
    { key: "B\u266d", pairs: ["Bb/F", "G/D"] },
    { key: "E\u266d", pairs: ["Eb/Bb", "Bb/F"] },
    { key: "A\u266d", pairs: ["Bb/F", "Eb/Bb"] },
    { key: "D\u266d", pairs: ["Eb/Bb", "Bb/F"] },
    { key: "G\u266d", pairs: ["Eb/Bb", "Bb/F"] },
    { key: "C\u266d", pairs: ["Eb/Bb"] }
  ];

  const CX = 200, CY = 200, R_OUT = 190, R_IN = 92, R_HUB = 78;
  const svg = document.getElementById("ring");
  const NS = "http://www.w3.org/2000/svg";

  // ---- Outer ring: bass-clef circle-of-fifths key signatures ----
  // Decorative reference ring, one stamp per wedge, in the same
  // circle-of-fifths order as NOTES, so stamp i sits at angle i*30deg,
  // directly outside wedge i.
  const RING_L = 7; // staff line spacing
  // Glyph outlines below are traced from Bravura (SIL Open Font License),
  // the standard SMuFL reference music font, not hand-drawn: extracted with
  // fontTools from Bravura.otf at their real design coordinates (1000
  // units/em, 250 units per staff-space, glyph origin = the line/space the
  // glyph anchors to). Filled shapes, not stroked lines, which is what
  // gives real engraving its calligraphic weight.
  const RING_GLYPH_SCALE = RING_L / 250;
  const RING_CLEF_PATH = "M252 262C78 262 0 135 0 39C0 -41 42 -110 123 -110C186 -110 229 -66 229 -4C229 60 182 100 133 100C106 100 96 93 83 93C70 93 67 101 67 111C67 151 127 224 229 224C335 224 381 120 381 -37C381 -140 359 -260 297 -356C237 -449 134 -534 10 -605C1 -610 -5 -615 -5 -623C-5 -629 -1 -635 8 -635C13 -635 19 -633 25 -630C158 -565 286 -489 392 -375C479 -281 531 -159 531 -28C531 146 425 262 252 262ZM629 180C598 180 574 156 574 125C574 94 598 70 629 70C660 70 684 94 684 125C684 156 660 180 629 180ZM630 -71C599 -71 576 -94 576 -125C576 -156 599 -179 630 -179C661 -179 684 -156 684 -125C684 -94 661 -71 630 -71Z";
  const RING_SHARP_PATH = "M237 118C244 121 249 129 249 135V206C249 211 246 214 242 214C240 214 239 214 237 213C237 213 217 205 212 204C205 204 198 209 198 217V339C198 345 192 350 184 350C174 350 168 345 168 339V209C167 199 164 186 155 180C143 173 109 159 92 155C83 155 80 167 80 175V295C80 301 73 306 66 306C56 306 50 301 50 295V160C50 146 44 136 38 133C32 130 12 122 12 122C5 120 0 112 0 106V35C0 29 3 26 8 26C9 26 11 27 12 27C12 27 27 33 34 37C35 37 36 38 37 38C44 38 50 28 50 20V-79C50 -90 45 -99 39 -102C33 -104 12 -113 12 -113C5 -115 0 -123 0 -129V-200C0 -206 3 -209 8 -209C9 -209 11 -208 12 -208C12 -208 26 -202 35 -199C36 -198 37 -198 38 -198C45 -198 50 -209 50 -214V-337C50 -343 56 -348 63 -348C73 -348 80 -343 80 -337V-198C80 -185 85 -178 90 -176L151 -151C152 -151 154 -150 155 -150C163 -150 168 -162 168 -168V-293C168 -299 174 -304 181 -304C192 -304 198 -299 198 -293V-151C198 -143 202 -131 209 -128C216 -125 237 -117 237 -117C244 -114 249 -106 249 -100V-29C249 -24 246 -21 242 -21C240 -21 239 -21 237 -22L211 -32C205 -32 198 -26 198 -14V79C198 86 203 105 211 108ZM168 -45C162 -65 115 -85 92 -85C86 -85 81 -83 80 -80C78 -76 77 -54 77 -30C77 1 78 36 80 44C82 61 128 82 153 82C160 82 166 80 168 76C170 71 172 46 172 19C172 -8 170 -36 168 -45Z";
  const RING_FLAT_PATH  = "M12 -170C15 -174 18 -175 21 -175C24 -175 27 -173 27 -173C57 -156 81 -129 106 -112C195 -50 226 11 226 57C226 114 182 150 136 153C129 153 122 152 115 150C104 147 92 143 81 136C75 131 64 122 59 122C57 122 56 122 54 123C47 126 43 133 43 140C44 162 50 402 50 422C50 433 41 439 31 439C17 439 1 429 0 411C0 411 4 -160 12 -170ZM47 -81C47 -81 44 -21 44 19C44 35 45 47 46 51C50 63 76 85 90 93C99 98 108 100 116 100C126 100 135 96 141 89C151 78 157 61 157 42C157 24 152 3 140 -18C127 -42 98 -74 68 -93C64 -95 61 -96 58 -96C49 -96 47 -86 47 -81Z";
  const RING_CLEF_X = 5;            // left margin before the clef
  const RING_CLEF_ANCHOR_Y = -3 * RING_L; // F line (line 4, counting bottom=1): the clef's design origin sits on this line
  const RING_SHARP_ORDER = [6, 3, 7, 4, 8, 5, 9]; // F# C# G# D# A# E# B#, as staff-position indices
  const RING_FLAT_ORDER  = [2, 5, 1, 4, 0, 3, -1]; // Bb Eb Ab Db Gb Cb Fb
  const RING_ACC_START_X = 30;
  const RING_ACC_DX = 10;
  const RING_STAFF_X0 = 0, RING_STAFF_X1 = 95;
  const RING_STAFF_MID_LOCAL = -2 * RING_L; // line 3 (local y), the staff's vertical middle
  const R_LABEL = 214; // key-name label radius
  const R_STAFF = 267; // staff vertical-center radius

  const OUTER_KEYS = [
    { label: "C",       sharps: 0, flats: 0 },
    { label: "G",       sharps: 1, flats: 0 },
    { label: "D",       sharps: 2, flats: 0 },
    { label: "A",       sharps: 3, flats: 0 },
    { label: "E",       sharps: 4, flats: 0 },
    { label: "B",       sharps: 5, flats: 0 },
    { label: "F♯", sharps: 6, flats: 0 },
    { label: "D♭", sharps: 0, flats: 5 },
    { label: "A♭", sharps: 0, flats: 4 },
    { label: "E♭", sharps: 0, flats: 3 },
    { label: "B♭", sharps: 0, flats: 2 },
    { label: "F",       sharps: 0, flats: 1 }
  ];

  function ringIndexToY(i) { return -i * (RING_L / 2); }

  // ---- Audio ----
  // Voices are keyed by "offset": semitones above C of the selected base
  // octave (0..18). pc = offset % 12. This lets a pair's fifth sit an
  // octave boundary above its root while retuning stays consistent.
  let ctx = null;
  let master = null;
  const voices = new Map();   // offset -> { oscs, gain, filter }
  let activeKey = null;       // currently active key preset name, or null
  let activePairIndex = 0;    // which of that key's primary pairs is sounding

  const octaveEl = document.getElementById("octave");
  const waveEl = document.getElementById("wave");
  const tuningEl = document.getElementById("tuning");
  const volEl = document.getElementById("vol");
  const temperamentEl = document.getElementById("temperament");

  // Standard 5-limit Just intonation chromatic scale, indexed by semitone
  // degree above the tonic (0-11): pure thirds/sixths/fifths, not a chain
  // of stacked fifths. This is what tuner apps mean by "Just".
  const DEGREE_RATIOS = [1, 16/15, 9/8, 6/5, 5/4, 4/3, 45/32, 3/2, 8/5, 5/3, 16/9, 15/8];

  // Each timbre exposes build(ctx, freq) -> { output, retune(freq), stop(time) }.
  // "output" is an unconnected AudioNode the caller wires into that voice's
  // envelope gain. This lets simple (single-oscillator) and elaborate
  // (multi-oscillator, filtered, modulated) timbres share one voice manager.

  function buildDetunedBasic(type, cutoffMult) {
    return function (ctx, f) {
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = Math.min(12000, f * cutoffMult);
      filter.Q.value = 0.4;
      const oscs = [-3, 3].map(cents => {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.value = f;
        o.detune.value = cents;
        o.connect(filter);
        o.start();
        return o;
      });
      return {
        output: filter,
        retune(newF) {
          oscs.forEach(o => o.frequency.setTargetAtTime(newF, ctx.currentTime, 0.05));
          filter.frequency.setTargetAtTime(Math.min(12000, newF * cutoffMult), ctx.currentTime, 0.05);
        },
        stop(t) { oscs.forEach(o => o.stop(t)); }
      };
    };
  }

  function buildPure(ctx, f) {
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = f;
    osc.start();
    return {
      output: osc,
      retune(newF) { osc.frequency.setTargetAtTime(newF, ctx.currentTime, 0.05); },
      stop(t) { osc.stop(t); }
    };
  }

  // Drawbar-style additive organ: five sine harmonics at fixed ratios with
  // decreasing level, plus a slow Leslie-style amplitude tremolo.
  function buildOrgan(ctx, f) {
    const ratios = [1, 2, 3, 4, 6];
    const levels = [1, 0.55, 0.35, 0.2, 0.12];
    const mix = ctx.createGain();
    mix.gain.value = 1;
    const harmonics = ratios.map((r, i) => {
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.value = f * r;
      const g = ctx.createGain();
      g.gain.value = levels[i];
      o.connect(g);
      g.connect(mix);
      o.start();
      return { osc: o, ratio: r };
    });

    const tremolo = ctx.createGain();
    tremolo.gain.value = 1;
    mix.connect(tremolo);
    const lfo = ctx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 5.5;
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.value = 0.08; // +-8% amplitude wobble
    lfo.connect(lfoDepth);
    lfoDepth.connect(tremolo.gain);
    lfo.start();

    return {
      output: tremolo,
      retune(newF) {
        harmonics.forEach(h => h.osc.frequency.setTargetAtTime(newF * h.ratio, ctx.currentTime, 0.05));
      },
      stop(t) { harmonics.forEach(h => h.osc.stop(t)); lfo.stop(t); }
    };
  }

  // Bowed string: detuned saws, brighter filter than "Warm", with a slow
  // pitch vibrato layered on top of the static detune.
  function buildBow(ctx, f) {
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = Math.min(12000, f * 6);
    filter.Q.value = 0.5;

    const oscs = [-4, 4].map(cents => {
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.frequency.value = f;
      o.detune.value = cents;
      o.connect(filter);
      o.start();
      return o;
    });

    const lfo = ctx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 5;
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.value = 6; // +-6 cents of vibrato
    lfo.connect(lfoDepth);
    oscs.forEach(o => lfoDepth.connect(o.detune));
    lfo.start();

    return {
      output: filter,
      retune(newF) {
        oscs.forEach(o => o.frequency.setTargetAtTime(newF, ctx.currentTime, 0.05));
        filter.frequency.setTargetAtTime(Math.min(12000, newF * 6), ctx.currentTime, 0.05);
      },
      stop(t) { oscs.forEach(o => o.stop(t)); lfo.stop(t); }
    };
  }

  // Choir: sawtooth core routed through three fixed-frequency bandpass
  // filters approximating vowel formants, so the resonances stay put while
  // the fundamental retunes underneath them, plus gentle vibrato.
  function buildChoir(ctx, f) {
    const oscs = [-3, 3].map(cents => {
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.frequency.value = f;
      o.detune.value = cents;
      o.start();
      return o;
    });

    const formants = [
      { freq: 700,  q: 8,  gain: 1.0 },
      { freq: 1200, q: 10, gain: 0.6 },
      { freq: 2600, q: 12, gain: 0.3 }
    ];
    const mix = ctx.createGain();
    mix.gain.value = 1;
    formants.forEach(spec => {
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = spec.freq;
      bp.Q.value = spec.q;
      const g = ctx.createGain();
      g.gain.value = spec.gain;
      oscs.forEach(o => o.connect(bp));
      bp.connect(g);
      g.connect(mix);
    });
    const makeup = ctx.createGain();
    makeup.gain.value = 3.0; // narrow bandpasses discard most of the energy
    mix.connect(makeup);

    const lfo = ctx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 5.3;
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.value = 5;
    lfo.connect(lfoDepth);
    oscs.forEach(o => lfoDepth.connect(o.detune));
    lfo.start();

    return {
      output: makeup,
      retune(newF) {
        // Formant filters stay put; vowel resonances don't move with pitch.
        oscs.forEach(o => o.frequency.setTargetAtTime(newF, ctx.currentTime, 0.05));
      },
      stop(t) { oscs.forEach(o => o.stop(t)); lfo.stop(t); }
    };
  }

  // Bell: two-operator FM (sine carrier, inharmonic-ratio sine modulator)
  // for a metallic, non-harmonic-series tone, gently smoothed afterward.
  function buildBell(ctx, f) {
    const carrier = ctx.createOscillator();
    carrier.type = "sine";
    carrier.frequency.value = f;

    const modRatio = 3.5;
    const modulator = ctx.createOscillator();
    modulator.type = "sine";
    modulator.frequency.value = f * modRatio;

    const modDepth = ctx.createGain();
    modDepth.gain.value = f; // moderate modulation index
    modulator.connect(modDepth);
    modDepth.connect(carrier.frequency);

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = Math.min(14000, f * 10);
    filter.Q.value = 0.3;
    carrier.connect(filter);

    carrier.start();
    modulator.start();

    return {
      output: filter,
      retune(newF) {
        carrier.frequency.setTargetAtTime(newF, ctx.currentTime, 0.05);
        modulator.frequency.setTargetAtTime(newF * modRatio, ctx.currentTime, 0.05);
        modDepth.gain.setTargetAtTime(newF, ctx.currentTime, 0.05);
        filter.frequency.setTargetAtTime(Math.min(14000, newF * 10), ctx.currentTime, 0.05);
      },
      stop(t) { carrier.stop(t); modulator.stop(t); }
    };
  }

  const TIMBRES = {
    warm:  { gain: 0.20, build: buildDetunedBasic("sawtooth", 4) },
    reed:  { gain: 0.16, build: buildDetunedBasic("square", 3) },
    pure:  { gain: 0.42, build: buildPure },
    glass: { gain: 0.35, build: buildDetunedBasic("triangle", 10) },
    organ: { gain: 0.12, build: buildOrgan },
    bow:   { gain: 0.18, build: buildBow },
    choir: { gain: 0.22, build: buildChoir, attack: 0.6, release: 0.5 },
    bell:  { gain: 0.20, build: buildBell }
  };

  function ensureCtx() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = volEl.value / 100 * 0.5;
      master.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
  }

  function freqOf(offset) {
    const a4 = Math.min(466, Math.max(400, parseFloat(tuningEl.value) || 440));
    const oct = parseInt(octaveEl.value, 10);

    if (temperamentEl.value === "just") {
      // Anchor D at this octave using equal temperament (so the A4 slider
      // still sets overall reference pitch), then look up every other
      // note's pure ratio relative to that D, folding octaves around D
      // itself rather than around C.
      const semitoneFromD = offset - 2; // D sits 2 semitones above C
      const degree = ((semitoneFromD % 12) + 12) % 12;
      const octaveShift = Math.floor(semitoneFromD / 12);
      const dMidi = (oct + 1) * 12 + 2;
      const freqD = a4 * Math.pow(2, (dMidi - 69) / 12);
      return freqD * DEGREE_RATIOS[degree] * Math.pow(2, octaveShift);
    }

    const midi = (oct + 1) * 12 + offset;
    return a4 * Math.pow(2, (midi - 69) / 12);
  }

  function startVoice(offset) {
    if (voices.has(offset)) return;
    ensureCtx();
    const t = TIMBRES[waveEl.value];
    const f = freqOf(offset);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(t.gain, ctx.currentTime + (t.attack || 0.25));

    const built = t.build(ctx, f);
    built.output.connect(gain);
    gain.connect(master);
    voices.set(offset, { built, gain, release: t.release || 0.2 });
  }

  function stopVoice(offset) {
    const v = voices.get(offset);
    if (!v) return;
    const now = ctx.currentTime;
    v.gain.gain.cancelScheduledValues(now);
    v.gain.gain.setValueAtTime(v.gain.gain.value, now);
    v.gain.gain.exponentialRampToValueAtTime(0.0001, now + v.release);
    v.built.stop(now + v.release + 0.05);
    voices.delete(offset);
  }

  function retuneAll() {
    if (!ctx) return;
    voices.forEach((v, offset) => {
      v.built.retune(freqOf(offset));
    });
  }

  function rebuildTimbre() {
    if (!ctx) return;
    [...voices.keys()].forEach(off => { stopVoice(off); startVoice(off); });
  }

  function syncUI() {
    const soundingPcs = new Set([...voices.keys()].map(o => o % 12));
    document.querySelectorAll(".wedge").forEach(w => {
      const on = soundingPcs.has(parseInt(w.dataset.pc, 10));
      w.classList.toggle("active", on);
      w.setAttribute("aria-pressed", on ? "true" : "false");
    });
    document.querySelectorAll(".key-btn").forEach(b => {
      const on = b.dataset.key === activeKey;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.querySelectorAll(".pair").forEach((span, i) => {
        span.classList.toggle("current", on && i === activePairIndex);
      });
    });
    const status = document.getElementById("hub-status");
    if (voices.size === 0) {
      status.textContent = "silent";
    } else if (activeKey) {
      const entry = KEYS.find(k => k.key === activeKey);
      const pairLabel = entry ? formatPairLabel(entry.pairs[activePairIndex]) : "";
      status.textContent = "key of " + activeKey + (entry && entry.pairs.length > 1 ? " · " + pairLabel : "");
    } else {
      const names = NOTES.filter(n => soundingPcs.has(n.pc)).map(n => n.label.split("/")[0]);
      status.textContent = names.join(" \u00b7 ");
    }
  }

  function stopAll() {
    [...voices.keys()].forEach(stopVoice);
    activeKey = null;
    activePairIndex = 0;
    syncUI();
  }

  // ---- Key presets ----
  // Each key preset lists one or two "primary drone pairs" (Scott Dixon
  // chart). Only one pair sounds at a time: the chart means "use G/D or
  // D/A", not "use both at once". Pressing the key's button again cycles
  // to its next pair; if it only has one pair, pressing again stops it.
  function formatPairLabel(name) {
    return name.replace(/#/g, "\u266f").replace(/b\//g, "\u266d/").replace(/Bb/g, "B\u266d").replace(/Eb/g, "E\u266d");
  }

  function pairOffsets(pairName) {
    const root = PAIRS[pairName];
    return new Set([root, root + 7]); // root plus a perfect fifth above it
  }

  function pressKey(entry) {
    if (activeKey === entry.key) {
      if (entry.pairs.length > 1) {
        activePairIndex = (activePairIndex + 1) % entry.pairs.length;
        [...voices.keys()].forEach(stopVoice);
        pairOffsets(entry.pairs[activePairIndex]).forEach(startVoice);
        syncUI();
      } else {
        stopAll();
      }
      return;
    }
    [...voices.keys()].forEach(stopVoice);
    activePairIndex = 0;
    pairOffsets(entry.pairs[0]).forEach(startVoice);
    activeKey = entry.key;
    syncUI();
  }

  const grid = document.getElementById("key-grid");
  KEYS.forEach(entry => {
    const b = document.createElement("button");
    b.className = "key-btn";
    b.dataset.key = entry.key;
    b.setAttribute("aria-pressed", "false");
    b.appendChild(document.createTextNode(entry.key));
    const small = document.createElement("small");
    entry.pairs.forEach((p, i) => {
      if (i > 0) small.appendChild(document.createTextNode(", "));
      const span = document.createElement("span");
      span.className = "pair";
      span.textContent = formatPairLabel(p);
      small.appendChild(span);
    });
    b.appendChild(small);
    if (entry.pairs.length > 1) {
      b.title = "Click again to switch between " + entry.pairs.map(formatPairLabel).join(" and ");
    }
    b.addEventListener("click", () => pressKey(entry));
    grid.appendChild(b);
  });

  // ---- Wedges ----
  function polar(r, deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
  }

  function toggleWedge(pc) {
    // Removing a tone: drop every sounding voice of that pitch class,
    // whichever octave a pair voiced it in. Adding: base octave.
    const matching = [...voices.keys()].filter(o => o % 12 === pc);
    if (matching.length > 0) {
      matching.forEach(stopVoice);
    } else {
      startVoice(pc);
    }
    activeKey = null; // manual edit means we are no longer exactly a preset
    activePairIndex = 0;
    syncUI();
  }

  NOTES.forEach((note, i) => {
    const a0 = i * 30 - 15, a1 = a0 + 30;
    const [x0o, y0o] = polar(R_OUT, a0), [x1o, y1o] = polar(R_OUT, a1);
    const [x0i, y0i] = polar(R_IN, a0),  [x1i, y1i] = polar(R_IN, a1);
    const d = `M ${x0o} ${y0o} A ${R_OUT} ${R_OUT} 0 0 1 ${x1o} ${y1o}
               L ${x1i} ${y1i} A ${R_IN} ${R_IN} 0 0 0 ${x0i} ${y0i} Z`;

    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "wedge");
    g.dataset.pc = note.pc;
    g.setAttribute("role", "button");
    g.setAttribute("tabindex", "0");
    g.setAttribute("aria-pressed", "false");
    g.setAttribute("aria-label", "Drone " + note.label.replace("\u266f", " sharp").replace("\u266d", " flat"));

    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d);
    g.appendChild(path);

    const [tx, ty] = polar((R_OUT + R_IN) / 2, i * 30);
    const text = document.createElementNS(NS, "text");
    text.setAttribute("x", tx);
    text.setAttribute("y", ty);
    text.textContent = note.label;
    g.appendChild(text);

    g.addEventListener("click", () => toggleWedge(note.pc));
    g.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleWedge(note.pc); }
    });
    svg.appendChild(g);
  });

  // ---- Hub (stop all) ----
  const hub = document.createElementNS(NS, "g");
  hub.setAttribute("id", "hub");
  hub.setAttribute("role", "button");
  hub.setAttribute("tabindex", "0");
  hub.setAttribute("aria-label", "Stop all drones");
  const hc = document.createElementNS(NS, "circle");
  hc.setAttribute("cx", CX); hc.setAttribute("cy", CY); hc.setAttribute("r", R_HUB);
  hub.appendChild(hc);
  const t1 = document.createElementNS(NS, "text");
  t1.setAttribute("id", "hub-status");
  t1.setAttribute("x", CX); t1.setAttribute("y", CY - 2);
  t1.textContent = "silent";
  hub.appendChild(t1);
  const t2 = document.createElementNS(NS, "text");
  t2.setAttribute("id", "hub-label");
  t2.setAttribute("x", CX); t2.setAttribute("y", CY + 20);
  t2.textContent = "TAP TO STOP ALL";
  hub.appendChild(t2);
  hub.addEventListener("click", stopAll);
  hub.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); stopAll(); }
  });
  svg.appendChild(hub);

  // ---- Outer ring: bass-clef circle-of-fifths (decorative reference) ----
  const ringLayer = document.createElementNS(NS, "g");
  ringLayer.setAttribute("id", "ring-layer");
  ringLayer.setAttribute("aria-hidden", "true");

  OUTER_KEYS.forEach((k, i) => {
    const angle = i * 30;
    const stampWidth = RING_STAFF_X1 - RING_STAFF_X0;

    const [lx, ly] = polar(R_LABEL, angle);
    const label = document.createElementNS(NS, "text");
    label.setAttribute("class", "ring-label");
    label.setAttribute("x", lx);
    label.setAttribute("y", ly);
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("dominant-baseline", "central");
    label.textContent = k.label;
    ringLayer.appendChild(label);

    const [sx, sy] = polar(R_STAFF, angle);
    const tx = sx - stampWidth / 2;
    const ty = sy - RING_STAFF_MID_LOCAL;
    const stamp = document.createElementNS(NS, "g");
    stamp.setAttribute("class", "ring-stamp");
    stamp.setAttribute("transform", `translate(${tx},${ty})`);

    for (let li = 0; li < 5; li++) {
      const y = -li * RING_L;
      const line = document.createElementNS(NS, "line");
      line.setAttribute("x1", RING_STAFF_X0);
      line.setAttribute("y1", y);
      line.setAttribute("x2", RING_STAFF_X1);
      line.setAttribute("y2", y);
      stamp.appendChild(line);
    }

    // Stamps one music-font glyph so its design origin lands at local
    // point (x, y), scaled from font units into staff-space units.
    function stampGlyph(pathData, x, y) {
      const g = document.createElementNS(NS, "g");
      g.setAttribute("transform",
        `translate(${x},${y}) scale(${RING_GLYPH_SCALE},${-RING_GLYPH_SCALE})`);
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", pathData);
      g.appendChild(p);
      stamp.appendChild(g);
    }

    stampGlyph(RING_CLEF_PATH, RING_CLEF_X, RING_CLEF_ANCHOR_Y);

    let ax = RING_ACC_START_X;
    if (k.sharps > 0) {
      for (let n = 0; n < k.sharps; n++) {
        stampGlyph(RING_SHARP_PATH, ax, ringIndexToY(RING_SHARP_ORDER[n]));
        ax += RING_ACC_DX;
      }
    } else if (k.flats > 0) {
      for (let n = 0; n < k.flats; n++) {
        stampGlyph(RING_FLAT_PATH, ax, ringIndexToY(RING_FLAT_ORDER[n]));
        ax += RING_ACC_DX;
      }
    }

    ringLayer.appendChild(stamp);
  });

  svg.appendChild(ringLayer);

  // ---- Control wiring ----
  octaveEl.addEventListener("change", retuneAll);
  tuningEl.addEventListener("input", retuneAll);
  temperamentEl.addEventListener("change", retuneAll);
  waveEl.addEventListener("change", rebuildTimbre);
  volEl.addEventListener("input", () => {
    if (master) master.gain.setTargetAtTime(volEl.value / 100 * 0.5, ctx.currentTime, 0.03);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") stopAll();
  });
})();
</script>
</body>
</html>
